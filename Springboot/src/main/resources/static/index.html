<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff6ff, #fce4ec);
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin-top: 8px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #444;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .add-btn {
            background: #667eea;
            color: white;
        }

        .search-btn {
            background: #00b894;
            color: white;
        }

        .refresh-btn {
            background: #0984e3;
            color: white;
        }

        .delete-all-btn {
            background: #d63031;
            color: white;
        }

        .edit-btn {
            background: #fdcb6e;
            color: #333;
            margin-right: 5px;
        }

        .delete-btn {
            background: #ff7675;
            color: white;
        }

        .search-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 14px;
        }

        td {
            padding: 13px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f9ff;
        }

        .actions {
            white-space: nowrap;
        }

        .message {
            text-align: center;
            padding: 15px;
            color: #777;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>🎓 Student Management System</h1>

        <p>Manage Student Records Easily</p>

    </div>


    <!-- ADD STUDENT -->

    <div class="card">

        <h2>➕ Add Student</h2>

        <div class="form-row">

            <input
                    type="text"
                    id="name"
                    placeholder="Student Name">

            <input
                    type="email"
                    id="email"
                    placeholder="Email">

            <input
                    type="text"
                    id="department"
                    placeholder="Department">

            <button
                    class="add-btn"
                    onclick="addStudent()">

                Add Student

            </button>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="card">

        <h2>🔎 Search Student</h2>

        <div class="search-area">

            <input
                    type="number"
                    id="searchId"
                    placeholder="Enter Roll No / ID">

            <button
                    class="search-btn"
                    onclick="searchStudent()">

                Search

            </button>

            <button
                    class="refresh-btn"
                    onclick="loadStudents()">

                View All

            </button>

            <button
                    class="delete-all-btn"
                    onclick="deleteAllStudents()">

                🗑️ Delete All

            </button>

        </div>

    </div>


    <!-- STUDENT TABLE -->

    <div class="card">

        <h2>📋 Student Records</h2>

        <table>

            <thead>

            <tr>

                <th>Roll No</th>

                <th>Name</th>

                <th>Email</th>

                <th>Department</th>

                <th>Actions</th>

            </tr>

            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>


<script>

    const API_URL = "/students";


    // =========================
    // LOAD ALL STUDENTS
    // =========================

    function loadStudents() {

        fetch(API_URL)

            .then(response => response.json())

            .then(students => {

                displayStudents(students);

            })

            .catch(error => {

                alert("Unable to load students!");

                console.error(error);

            });

    }


    // =========================
    // DISPLAY STUDENTS
    // =========================

    function displayStudents(students) {

        const table = document.getElementById("studentTable");

        table.innerHTML = "";


        if (students.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5" class="message">
                        No students found
                    </td>
                </tr>
            `;

            return;
        }


        students.forEach(student => {

            table.innerHTML += `

                <tr>

                    <td>${student.id}</td>

                    <td>${student.name}</td>

                    <td>${student.email}</td>

                    <td>${student.department}</td>

                    <td class="actions">

                        <button
                            class="edit-btn"
                            onclick="editStudent(${student.id})">

                            ✏️ Edit

                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${student.id})">

                            🗑️ Delete

                        </button>

                    </td>

                </tr>

            `;

        });

    }


    // =========================
    // ADD STUDENT
    // =========================

    function addStudent() {

        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const department =
            document.getElementById("department").value;


        if (!name || !email || !department) {

            alert("Please fill all fields!");

            return;
        }


        const student = {

            name: name,

            email: email,

            department: department

        };


        fetch(API_URL, {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify(student)

        })

            .then(response => response.json())

            .then(() => {

                alert("✅ Student added successfully!");

                document.getElementById("name").value = "";

                document.getElementById("email").value = "";

                document.getElementById("department").value = "";

                loadStudents();

            })

            .catch(error => {

                alert("Error adding student!");

                console.error(error);

            });

    }


    // =========================
    // SEARCH BY ID
    // =========================

    function searchStudent() {

        const id =
            document.getElementById("searchId").value;


        if (!id) {

            alert("Please enter Roll No / ID");

            return;
        }


        fetch(`${API_URL}/${id}`)

            .then(response => {

                if (!response.ok) {

                    throw new Error("Student not found");

                }

                return response.json();

            })

            .then(student => {

                displayStudents([student]);

            })

            .catch(error => {

                alert("❌ Student not found!");

            });

    }


    // =========================
    // EDIT STUDENT
    // =========================

    function editStudent(id) {

        const name =
            prompt("Enter new name:");

        if (name === null) return;


        const email =
            prompt("Enter new email:");

        if (email === null) return;


        const department =
            prompt("Enter new department:");

        if (department === null) return;


        const student = {

            name: name,

            email: email,

            department: department

        };


        fetch(`${API_URL}/${id}`, {

            method: "PUT",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify(student)

        })

            .then(response => response.json())

            .then(() => {

                alert("✅ Student updated successfully!");

                loadStudents();

            });

    }


    // =========================
    // DELETE ONE STUDENT
    // =========================

    function deleteStudent(id) {

        const confirmDelete =
            confirm("Are you sure you want to delete this student?");


        if (!confirmDelete) return;


        fetch(`${API_URL}/${id}`, {

            method: "DELETE"

        })

            .then(response => response.text())

            .then(message => {

                alert("🗑️ " + message);

                loadStudents();

            });

    }


    // =========================
    // DELETE ALL STUDENTS
    // =========================

    function deleteAllStudents() {

        const confirmDelete =
            confirm("⚠️ Are you sure you want to delete ALL students?");


        if (!confirmDelete) return;


        fetch(API_URL)

            .then(response => response.json())

            .then(students => {

                const deleteRequests =
                    students.map(student =>

                        fetch(`${API_URL}/${student.id}`, {

                            method: "DELETE"

                        })

                    );


                return Promise.all(deleteRequests);

            })

            .then(() => {

                alert("🗑️ All students deleted!");

                loadStudents();

            });

    }


    // =========================
    // LOAD WHEN PAGE OPENS
    // =========================

    loadStudents();

</script>

</body>

</html>
